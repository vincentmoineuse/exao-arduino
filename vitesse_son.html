<script>
const $ = id => document.getElementById(id);

const pause = ms => new Promise(r => setTimeout(r, ms));

window.addEventListener('pagehide', () => { if (port) { const p = port; port = null; p.close().catch(() => {}); } });

$('conn').onclick = async () => {
  // PC (Chrome, Edge) et Android 17+ : Web Serial natif ; tablette Android plus ancienne : WebUSB (polyfill Google)
  // Sur Android, Chrome expose navigator.serial pour le Bluetooth mais (avant Android 17) ne liste pas l'USB filaire :

      (voie.startsWith('WebUSB') && e && e.name === 'NotFoundError'
        ? " — aucune carte détectée : vérifiez l'adaptateur OTG (la LED ON de l'Arduino doit s'allumer), débranchez puis rebranchez la carte. Les clones à puce CH340 ne sont pas reconnus sur tablette."
        : /claim/i.test(msg(e))
        ? " — la carte est encore occupée : fermez les autres onglets de cette page et toute application USB (terminal série…), débranchez puis rebranchez la carte, puis réessayez."
        : '');
    return;

    const reader = dec.readable.getReader();
    try {
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        if (erreurs) {                                   // les données reviennent après une erreur
          erreurs = 0;
          $('etat').textContent = `connecté — ${voie} (${reprises} reprise(s) automatique(s) ; dernière erreur : ${dernErr})`;
        }
        buf += value;
        let i;
        while ((i = buf.indexOf('\n')) >= 0) { traiter(buf.slice(0, i).trim()); buf = buf.slice(i + 1); }
      }
    } catch (e) {
      erreurs++; reprises++; dernErr = msg(e);
      $('etat').textContent = `connecté — ${voie} (reprise après une erreur de lecture : ${dernErr})`;
    } finally {
      reader.releaseLock();
    }
    buf = '';
    if (erreurs > 20) break;
    await pause(200);
  }

  try { await port.close(); } catch (e) {}
  port = null;

let nLignes = 0;
function traiter(l) {
  nLignes++;
  document.getElementById('diag').textContent = `diagnostic : ${nLignes} ligne(s) reçue(s) — dernière : « ${l.slice(0, 40)} »`;
  if (!l.startsWith('T;')) return;
  const p = l.split(';').map(Number);
  if (p.length < 5 || p.slice(1).some(isNaN)) return;   // ligne incomplète (reprise de flux)
  const t = p[1];
  $('t').textContent = t > 0 ? t : '—';
  $('disp').textContent = t > 0 ? `(min ${p[2]} – max ${p[3]}, ${p[4]} mesures valides)` : '(pas de signal)';
